name: Update Daily Edition

on:
  schedule:
    # 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 SAST (UTC+2, no DST)
    - cron: "0 4,7,10,13,16,19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build edition
        run: npm run build

      - name: Commit updated edition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update daily edition"
            git push
          fi
