<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Daily Edition</title>
<meta name="description" content="A personal daily news edition — chess, world news, Springboks and Proteas." />

<!-- iPad / iOS "Add to Home Screen" -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Daily Edition" />
<meta name="theme-color" content="#f4efe4" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="style.css?v=1" />
</head>
<body>
<header class="masthead">
  <div class="masthead-inner">
    <p class="masthead-kicker">Personal Edition</p>
    <h1 class="masthead-title">The Daily Edition</h1>
    <div class="masthead-meta">
      <span id="edition-date"></span>
      <span class="dot">·</span>
      <span id="edition-label">Loading…</span>
    </div>
  </div>
</header>

<nav id="jump-nav" class="jump-nav" aria-label="Sections"></nav>

<main id="paper" class="paper">
  <p id="status" class="status">Fetching this morning's edition…</p>
</main>

<footer class="colophon">
  <p>Assembled automatically each morning and topped up through the day.</p>
</footer>

<script src="app.js?v=1"></script>
</body>
</html>
